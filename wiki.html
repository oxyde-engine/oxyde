<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxyde Docs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  /* Layout: fixed steel sidebar of grouped links + a scrolling reading column;
     one molten-oxide accent, the same identity as the Oxyde landing page. */
  :root {
    --bg:#080a0d; --bg-2:#0d1015; --panel:#12151c; --side:#0b0d11;
    --fg:#eef1f6; --muted:#9aa2b1; --faint:#5b6372;
    --line:#232a37; --line-2:#323a4b;
    --rust:#ef6a24; --rust-2:#ff8a44; --ember:#ffb061; --steel:#35c9b0;
    color-scheme:dark;
    --f-display:"Oxanium","Segoe UI",system-ui,sans-serif;
    --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,monospace;
    --sidew:272px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--f-body); -webkit-font-smoothing:antialiased;
  }
  a{color:var(--rust-2); text-decoration:none;}
  a:hover{text-decoration:underline;}

  .shell{display:flex; min-height:100%;}

  /* ---------- SIDEBAR ---------- */
  .side{
    width:var(--sidew); flex:0 0 var(--sidew);
    background:var(--side); border-right:1px solid var(--line);
    position:sticky; top:0; height:100vh; overflow-y:auto;
    padding:0 0 40px;
  }
  .brand{
    display:flex; align-items:center; gap:.55rem;
    font-family:var(--f-display); font-weight:800; letter-spacing:.05em; font-size:1.2rem;
    padding:18px 20px; position:sticky; top:0; background:var(--side);
    border-bottom:1px solid var(--line-2); z-index:2;
  }
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--rust);box-shadow:0 0 14px var(--rust);}
  .brand small{font-family:var(--f-mono);font-weight:400;font-size:.66rem;color:var(--faint);letter-spacing:.1em;margin-left:auto;}
  nav{padding:14px 12px;}
  .grp{font-family:var(--f-display);font-weight:600;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rust);padding:16px 10px 6px;}
  .grp.sub{color:var(--steel);padding-left:18px;font-size:.68rem;}
  nav a{
    display:block; color:var(--muted); font-size:.88rem;
    padding:5px 10px; border-radius:3px; border-left:2px solid transparent;
  }
  nav a:hover{color:var(--fg); background:rgba(255,255,255,0.03); text-decoration:none;}
  nav a.active{color:var(--fg); background:rgba(239,106,36,0.12); border-left-color:var(--rust);}
  nav a.sub{padding-left:22px;}

  /* ---------- CONTENT ---------- */
  .main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    display:none; align-items:center; gap:.8rem;
    padding:12px 16px; border-bottom:1px solid var(--line); background:var(--bg-2);
    position:sticky; top:0; z-index:5;
  }
  .menu-btn{
    font-family:var(--f-display);font-weight:600;font-size:.9rem;
    background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:3px;padding:.4em .8em;cursor:pointer;
  }
  .doc{
    max-width:800px; width:100%;
    margin:0 auto; padding:48px clamp(20px,5vw,56px) 120px;
    padding-left:max(20px,env(safe-area-inset-left,0px));
    padding-right:max(20px,env(safe-area-inset-right,0px));
  }
  .doc.loading{opacity:.4;}

  /* markdown */
  .doc h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.9rem,4vw,2.5rem);line-height:1.1;letter-spacing:-.01em;margin:.2em 0 .7em;text-wrap:balance;}
  .doc h2{font-family:var(--f-display);font-weight:600;font-size:1.5rem;margin:2.2rem 0 .6rem;padding-top:1.4rem;border-top:1px solid var(--line-2);letter-spacing:-.005em;}
  .doc h3{font-family:var(--f-display);font-weight:600;font-size:1.18rem;color:var(--fg);margin:1.6rem 0 .5rem;}
  .doc h4{font-family:var(--f-display);font-weight:600;font-size:1rem;color:var(--muted);margin:1.3rem 0 .4rem;letter-spacing:.02em;}
  .doc p,.doc li{font-size:.97rem;line-height:1.72;color:#d6dbe3;}
  .doc p{margin:0 0 1.05rem;}
  .doc ul,.doc ol{margin:0 0 1.1rem;padding-left:1.4rem;}
  .doc li{margin:.3rem 0;}
  .doc li::marker{color:var(--rust);}
  .doc strong{color:var(--fg);font-weight:600;}
  .doc em{color:var(--steel);font-style:normal;}
  .doc code{font-family:var(--f-mono);font-size:.84em;color:var(--steel);background:rgba(53,201,176,0.1);padding:.12em .4em;border-radius:3px;}
  .doc pre{background:#070809;border:1px solid var(--line);border-radius:5px;padding:16px 18px;overflow-x:auto;margin:0 0 1.2rem;}
  .doc pre code{color:#cdd3db;background:none;padding:0;font-size:.84rem;line-height:1.6;}
  .doc blockquote{border-left:3px solid var(--rust);margin:0 0 1.2rem;padding:.3rem 0 .3rem 1.1rem;color:var(--muted);}
  .doc blockquote p:last-child{margin-bottom:0;}
  .doc a{color:var(--rust-2);}
  .doc hr{border:none;border-top:1px solid var(--line);margin:2rem 0;}
  .doc table{border-collapse:collapse;width:100%;margin:0 0 1.3rem;font-size:.88rem;display:block;overflow-x:auto;}
  .doc th,.doc td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top;}
  .doc th{background:var(--bg-2);font-family:var(--f-display);font-weight:600;color:var(--fg);}
  .doc td code{white-space:nowrap;}
  .doc img{max-width:100%;border:1px solid var(--line);border-radius:4px;}
  .doc-foot{max-width:800px;margin:0 auto;padding:0 clamp(20px,5vw,56px) 80px;color:var(--faint);font-size:.8rem;font-family:var(--f-mono);}

  /* ---------- FLASHY CHROME ---------- */
  #meter{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;background:linear-gradient(90deg,var(--steel),var(--rust),var(--ember));box-shadow:0 0 10px rgba(239,106,36,.6);}
  .brand .dot{animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.4;}}
  nav a.active{box-shadow:inset 2px 0 0 var(--rust), -1px 0 12px -4px var(--rust);}
  .sidelinks{display:flex;gap:8px;padding:12px 16px 4px;}
  .sidelinks a{flex:1;text-align:center;font-family:var(--f-display);font-weight:700;font-size:.76rem;padding:9px 6px;border-radius:8px;border:1px solid var(--line-2);transition:.15s;}
  .sidelinks a.home{color:var(--muted);background:var(--panel);}
  .sidelinks a.home:hover{border-color:var(--steel);color:var(--fg);text-decoration:none;box-shadow:0 8px 24px -12px rgba(53,201,176,.5);}
  .sidelinks a.dl{background:var(--rust);color:#170b03;border-color:var(--rust);}
  .sidelinks a.dl:hover{background:var(--rust-2);text-decoration:none;transform:translateY(-1px);box-shadow:0 10px 30px -10px rgba(239,106,36,.6);}

  .dochero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);min-height:198px;display:flex;align-items:flex-end;background:#070a0e;}
  .dochero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .dh-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,13,.1),rgba(8,10,13,.5) 62%,var(--bg));pointer-events:none;}
  .dh-vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 20px rgba(0,0,0,.6);}
  .dh-inner{position:relative;z-index:2;max-width:800px;width:100%;margin:0 auto;padding:30px clamp(20px,5vw,56px) 24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));}
  .dh-kicker{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);}
  .dh-kicker::before{content:"";width:28px;height:2px;background:var(--rust);box-shadow:0 0 10px var(--rust);}
  .dh-title{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,4.6vw,2.9rem);letter-spacing:-.02em;margin:11px 0 7px;line-height:1.03;text-shadow:0 0 42px rgba(239,106,36,.28);}
  .dh-path{font-family:var(--f-mono);font-size:.73rem;color:var(--faint);}
  .doc > h1:first-child{display:none;}
  .doc{animation:rise .5s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @media(max-width:860px){ .dochero{min-height:150px;} }
  @media (prefers-reduced-motion:reduce){ .doc{animation:none;} .brand .dot{animation:none;} }

  .scrim{display:none;}

  @media (max-width:860px){
    .side{
      position:fixed; left:0; top:0; z-index:40; height:100%;
      transform:translateX(-100%); transition:transform .22s ease;
      box-shadow:0 0 40px rgba(0,0,0,.6);
    }
    body.nav-open .side{transform:none;}
    .topbar{display:flex;}
    .scrim{display:block; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30; opacity:0; pointer-events:none; transition:opacity .2s;}
    body.nav-open .scrim{opacity:1; pointer-events:auto;}
    .doc{padding-top:28px;}
  }
  @media (prefers-reduced-motion:reduce){ .side{transition:none;} }
</style>
</head>
<body>

<div id="meter"></div>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand"><span class="dot"></span><span class="wm"><span style="color:var(--rust)">OX</span>YDE</span><small>DOCS</small></div>
    <div class="sidelinks">
      <a class="home" href="index.html">← Oxyde</a>
      <a class="dl" href="https://github.com/oxyde-engine/oxyde/releases/latest">Download</a>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰ Docs</button>
      <span style="font-family:var(--f-display);font-weight:600;" id="mobileTitle">Oxyde</span>
    </div>
    <header class="dochero" id="dochero">
      <canvas id="grid"></canvas>
      <div class="dh-fade"></div>
      <div class="dh-vig"></div>
      <div class="dh-inner">
        <div class="dh-kicker" id="docKicker">Documentation</div>
        <h1 class="dh-title" id="docTitle">Oxyde</h1>
        <div class="dh-path" id="docPath">docs/</div>
      </div>
    </header>
    <article class="doc" id="doc">Loading…</article>
    <div class="doc-foot" id="foot"></div>
  </div>
</div>

<script>
const GROUPS = [
  {g:"Start here", items:[["FAQ","FAQ"],["ARCHITECTURE","Architecture"],["COMPATIBILITY","Compatibility"],["CUSTOMISATION","Customisation"],["CAPABILITIES","Capabilities"]]},
  {g:"Playing", items:[["MODES","Modes"],["RULESETS","Rulesets"],["BONUS","Bonus games"],["TAG","Tag"],["PARRY","Parry & defense"],["SUPER-EFFECTS","Super effects"]]},
  {g:"Knuckle Up", sub:true, items:[["KNUCKLE-UP","Overview"],["KNUCKLE-UP-FLOW","Run flow"],["KNUCKLE-UP-CAMPAIGNS","Campaigns"],["KNUCKLE-UP-STAGES","Belt stages"],["KNUCKLE-UP-AUTHORING","Authoring"]]},
  {g:"Online", sub:true, items:[["NETPLAY","Netplay"],["COOP-ONLINE","Online co-op"],["COOP-MULTIPEER","Multipeer"],["CORROSION","Corrosion spectator"]]},
  {g:"Authoring", items:[["FUSE","FUSE language"],["CONTROLLERS","State controllers"],["TRIGGERS","Triggers"],["STATES","Common states"],["EXTENSIONS","Extensions"],["STAGE-LOGIC","Stage logic"],["SCRIPTING","Lua scripting"],["MODDING","Modding"],["MOD-MANIFEST","Mod manifest"]]},
  {g:"Screenpacks", items:[["AUTHORING-SCREENPACKS","Screenpacks"],["SCREENPACK-SCRIPTING","Screenpack scripting"],["RENDERING","Rendering"],["CONFIGURATION","Configuration"]]},
  {g:"Working with a roster", items:[["BYOC","Bring your own chars"],["IMPORT-PIPELINE","Import pipeline"],["FUSE-CONVERSION","FUSE conversion"],["FUSE-COVERAGE","FUSE coverage"],["BALANCE","Balance"],["HD-SPRITES","HD / UHD sprites"],["DIAGNOSTICS","Diagnostics"]]},
  {g:"Diagnosing a fault", items:[["CASEBOOK","Casebook"],["VALIDATION","Content validation"],["TOOLS","oxtool"],["MCP","MCP server"]]},
  {g:"Compared", items:[["VS-MUGEN","vs WinMUGEN"],["VS-ENGINES","vs Ikemen & others"]]},
  {g:"Internals", items:[["PERFORMANCE","Performance"]]},
];
const TITLES = {};
const GROUPOF = {};
GROUPS.forEach(gr=>gr.items.forEach(([id,t])=>{TITLES[id]=t;GROUPOF[id]=gr.g;}));

// build nav
const nav = document.getElementById('nav');
GROUPS.forEach(gr=>{
  const h=document.createElement('div');
  h.className='grp'+(gr.sub?' sub':''); h.textContent=gr.g; nav.appendChild(h);
  gr.items.forEach(([id,t])=>{
    const a=document.createElement('a');
    a.href='#'+id; a.textContent=t; a.dataset.id=id;
    if(gr.sub) a.className='sub';
    nav.appendChild(a);
  });
});

const docEl=document.getElementById('doc');
const footEl=document.getElementById('foot');
const cache={};
const VALID=new Set(Object.keys(TITLES));

if(window.marked&&marked.setOptions) marked.setOptions({gfm:true,breaks:false,headerIds:false,mangle:false});

async function load(id){
  if(!VALID.has(id)) id='CAPABILITIES';
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  document.getElementById('mobileTitle').textContent=TITLES[id];
  docEl.classList.add('loading');
  try{
    let md=cache[id];
    if(md==null){
      const r=await fetch('docs/'+id+'.md');
      if(!r.ok) throw new Error(r.status);
      md=await r.text(); cache[id]=md;
    }
    docEl.innerHTML = window.marked ? marked.parse(md) : ('<pre>'+md.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre>');
    // banner: real H1 text as the title, section as the kicker
    const h1=docEl.querySelector('h1');
    document.getElementById('docTitle').textContent = h1 ? h1.textContent : TITLES[id];
    document.getElementById('docKicker').textContent = GROUPOF[id] || 'Documentation';
    document.getElementById('docPath').textContent = 'docs/'+id+'.md';
    // intercept cross-doc .md links
    docEl.querySelectorAll('a[href$=".md"]').forEach(a=>{
      const base=a.getAttribute('href').split('/').pop().replace(/\.md$/,'');
      if(VALID.has(base)){ a.addEventListener('click',e=>{e.preventDefault();location.hash=base;}); }
    });
    footEl.textContent='docs/'+id+'.md — Oxyde engine documentation';
    docEl.scrollIntoView({block:'start'});
    window.scrollTo(0,0);
  }catch(err){
    docEl.innerHTML='<h1>Not found</h1><p>Could not load <code>docs/'+id+'.md</code> ('+err.message+').</p>';
  }
  docEl.classList.remove('loading');
  document.body.classList.remove('nav-open');
}

function route(){ load((location.hash||'#CAPABILITIES').slice(1)); }
window.addEventListener('hashchange',route);

// mobile drawer
document.getElementById('menuBtn').addEventListener('click',()=>document.body.classList.toggle('nav-open'));
document.getElementById('scrim').addEventListener('click',()=>document.body.classList.remove('nav-open'));

// scroll meter
(function(){
  const m=document.getElementById('meter');
  function on(){ const h=document.documentElement, max=h.scrollHeight-h.clientHeight; m.style.width=(max>0?(h.scrollTop/max*100):0)+'%'; }
  document.addEventListener('scroll',on,{passive:true}); on();
})();

// animated depth-grid banner (reduced-motion safe)
(function(){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.getElementById('grid'); if(!cv) return;
  const ctx=cv.getContext('2d'); let W=0,H=0,dpr=1,t=0;
  function size(){ dpr=Math.min(window.devicePixelRatio||1,2); const r=cv.getBoundingClientRect(); W=r.width; H=r.height; cv.width=Math.max(1,W*dpr); cv.height=Math.max(1,H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); }
  size(); window.addEventListener('resize',size);
  function draw(){
    ctx.clearRect(0,0,W,H);
    const hz=H*0.14, vx=W*0.5, N=18;
    for(let i=-N;i<=N;i++){
      const fx=vx+(i/N)*W*1.5;
      ctx.beginPath(); ctx.moveTo(vx,hz); ctx.lineTo(fx,H);
      ctx.strokeStyle='rgba(53,201,176,'+(0.045+0.02*Math.cos(i*0.5))+')'; ctx.lineWidth=1; ctx.stroke();
    }
    const R=24;
    for(let j=0;j<R;j++){
      const p=((j/R)+(t*0.0016))%1;
      const y=hz+Math.pow(p,2.3)*(H-hz);
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y);
      ctx.strokeStyle='rgba(239,106,36,'+(0.03+0.16*p)+')'; ctx.lineWidth=1; ctx.stroke();
    }
    // horizon glow
    const g=ctx.createLinearGradient(0,hz-30,0,hz+30);
    g.addColorStop(0,'rgba(239,106,36,0)'); g.addColorStop(.5,'rgba(239,106,36,.10)'); g.addColorStop(1,'rgba(239,106,36,0)');
    ctx.fillStyle=g; ctx.fillRect(0,hz-30,W,60);
    t+=1; if(!reduce) requestAnimationFrame(draw);
  }
  if(reduce) draw(); else requestAnimationFrame(draw);
})();

route();
</script>
</body>
</html>
